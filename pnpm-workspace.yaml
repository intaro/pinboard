# pnpm settings (pnpm 10+ reads them from here, not from package.json/.npmrc).

# Do not auto-install optional peer dependencies.
# sass-loader lists node-sass as an optional peer; with auto-install enabled
# pnpm pulled node-sass (+ its node-gyp/tar/glob native-build chain), which the
# project does not use (we build with Dart `sass`) and which carried numerous
# CVEs. This keeps the frontend toolchain on Dart sass only.
autoInstallPeers: false

# Supply-chain guard: refuse versions published less than 24h ago, giving the
# ecosystem time to catch malicious releases before they land in our lockfile.
minimumReleaseAge: 1440

# pnpm 12.3+ turns strict mode on whenever minimumReleaseAge is set explicitly,
# and strict mode rejects the `pnpm update --no-save` call Dependabot makes, so
# every grouped npm PR would fail (dependabot/dependabot-core#16375). false
# keeps the pnpm 11 behaviour: the 24h gate still applies, and only when no
# version in the requested range is old enough does pnpm fall back to a newer one.
minimumReleaseAgeStrict: false

# The pnpm version is pinned by package.json "packageManager" and enforced by
# corepack (CI, Dockerfile.pinboard, `make test`). With pnpm 12 the default
# (`download`) also writes pnpm's own resolution into a leading YAML document of
# pnpm-lock.yaml; GitHub's dependency graph reads only that first document, so
# npm dependencies vanish from it and Dependabot security alerts stop
# (dependabot/dependabot-core#15904, pnpm/pnpm#13805). `ignore` keeps the
# lockfile single-document. Revisit once GitHub parses multi-document lockfiles.
pmOnFail: ignore

# Network resilience for cold installs (the minimumReleaseAge check fetches
# registry metadata for every locked package).
fetchRetries: 5
fetchTimeout: 120000

overrides:
  uuid: '>=11.1.1'

# Dependency build scripts are blocked by default (pnpm 10+ supply-chain
# hardening). Both current candidates are explicitly denied:
# - core-js: postinstall only prints a funding banner
# - @parcel/watcher: ships prebuilt binaries via optionalDependencies; the
#   install script is a source-build fallback we don't need
allowBuilds:
  '@parcel/watcher': false
  core-js: false
