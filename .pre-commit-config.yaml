repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        exclude: ^(docker/)?docker-compose[^/]*\.ya?ml$
      # Compose files use Compose-specific YAML tags (`!override`, `!reset`)
      # that a plain YAML loader rejects; check them for syntax only.
      - id: check-yaml
        name: check yaml (compose, syntax only)
        args: [--unsafe]
        files: ^(docker/)?docker-compose[^/]*\.ya?ml$
      - id: check-json
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-illegal-windows-names
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        name: Hadolint
        description: "Validate Dockerfile syntax and best practices"
        files: ^(docker/.*/Dockerfile|Dockerfile\..+)$
