; Pinboard overrides on top of php.ini-production (see Dockerfile.pinboard).

; php.ini-production still sends "X-Powered-By: PHP/<version>"; don't
; advertise the exact PHP version.
expose_php = Off

; OPcache runs with the base-image defaults, which fit this app with headroom
; (about 1,000 cached scripts and 22 MB used). opcache.preload is deliberately
; not enabled: measured gain was ~0.3 ms per request, within noise. See
; docs/docker.md -> "PHP runtime configuration" before changing this.
